[project]
name = "eval-harness"
version = "0.1.0"
description = "Score existing chat scenarios with an LLM judge and report pass rates."
requires-python = ">=3.12"
dependencies = [
    "langchain-aws>=1.7.0",
    "langchain-core>=1.5.3",
    "python-dotenv>=1.1.0",
]

[project.scripts]
eval-harness = "eval_harness.cli:run"

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[project]
name = "course-agent"
version = "0.1.0"
description = "A minimal LangChain/LangGraph agent with three dummy course tools."
requires-python = ">=3.12"
dependencies = [
    "langchain-aws>=1.7.1",
    "langchain-core>=1.5.6",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
course-agent = "course_agent.cli:run"
# `uv run dev` — the counterpart to the TypeScript agent's `pnpm dev`.
dev = "course_agent.cli:run"

[dependency-groups]
dev = [
    "mypy>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_agent"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true

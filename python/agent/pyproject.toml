[project]
name = "agent"
version = "0.1.0"
description = "A minimal LangChain/LangGraph agent with three dummy page tools."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.0",
    "langchain-aws>=1.7.2",
    "langchain-core>=1.5.6",
    "langchain-google-genai>=4.3.4",
    "langgraph>=1.2.11",
    "python-dotenv>=1.1.0",
]

[project.scripts]
agent = "agent.cli:run"
# `uv run dev` — the counterpart to the TypeScript agent's `pnpm dev`.
dev = "agent.cli:run"

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true

# boto3/botocore ship no py.typed marker, and boto3-stubs is far heavier than a
# demo warrants. Only proxy_model.py touches them.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
